name: Compile LaTeX Resume

on:
  push:
    paths:
      - 'portfolio/resume.tex'
  workflow_dispatch:

jobs:
  build_resume:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: portfolio

      - name: Move PDF to Public folder
        run: |
          mkdir -p portfolio/public
          mv portfolio/resume.pdf portfolio/public/resume.pdf

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add portfolio/public/resume.pdf
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-compile resume.tex to public/resume.pdf" && git push)
