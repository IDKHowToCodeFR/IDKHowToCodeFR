name: Metrics
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
  # push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: IDKHowToCodeFR
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Calcutta
          config_display: large
          config_octicon: yes
          plugin_achievements: no
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: X
          plugin_activity: no
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr, release, review
          plugin_activity_limit: 100
          plugin_activity_load: 300
          plugin_activity_visibility: public
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_indepth: yes
          plugin_followup_sections: repositories
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15
          plugin_languages_categories: data, markup, programming, prose
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_indepth: no
          plugin_languages_details : bytes-size, lines, percentage
          plugin_languages_recent_categories: data, markup, programming, prose
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 1000
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_skipped: mayanktyagi18122000/Gateway-Distriparks, pratistha09/Gateway-Distriparks
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes
          plugin_notable_types: commit, issue, pull_request
